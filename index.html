\"#kuendigen\" sc-camel-on-click=\"{{ nav.kuendigen }}\" style=\"color:#1A1512; text-decoration:underline;\">‚Verträge hier kündigen‘<\u002Fa> unten auf jeder Seite. Ihr erhaltet sofort eine Bestätigung per E-Mail.<\u002Fp><\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"border-bottom:1px solid #1A1512;\">\n<h3><button type=\"button\" sc-camel-on-click=\"{{ faqT.a6 }}\" aria-expanded=\"{{ faqOpen.a6 }}\" style=\"width:100%; display:flex; justify-content:space-between; align-items:center; gap:24px; padding:22px 0; background:transparent; border:0; cursor:pointer; text-align:left; font-size:20px; line-height:28px; font-weight:500; color:#1A1512;\"><span>Was kostet der Versand?<\u002Fspan><span aria-hidden=\"true\" style=\"flex:none; width:28px; text-align:center; font-size:26px; font-weight:400;\">{{ faqSign.a6 }}<\u002Fspan><\u002Fbutton><\u002Fh3>\n<sc-if value=\"{{ faqOpen.a6 }}\"><p style=\"padding:0 0 24px; font-size:18px; line-height:29px; color:#4A423B; max-width:680px;\">Versandkostenfrei ab 49 € in DE, darunter <span data-todo=\"1\">[Betrag festlegen]<\u002Fspan>.<\u002Fp><\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"border-bottom:1px solid #1A1512;\">\n<h3><button type=\"button\" sc-camel-on-click=\"{{ faqT.a7 }}\" aria-expanded=\"{{ faqOpen.a7 }}\" style=\"width:100%; display:flex; justify-content:space-between; align-items:center; gap:24px; padding:22px 0; background:transparent; border:0; cursor:pointer; text-align:left; font-size:20px; line-height:28px; font-weight:500; color:#1A1512;\"><span>Wann wird geliefert?<\u002Fspan><span aria-hidden=\"true\" style=\"flex:none; width:28px; text-align:center; font-size:26px; font-weight:400;\">{{ faqSign.a7 }}<\u002Fspan><\u002Fbutton><\u002Fh3>\n<sc-if value=\"{{ faqOpen.a7 }}\"><p style=\"padding:0 0 24px; font-size:18px; line-height:29px; color:#4A423B; max-width:680px;\"><span data-todo=\"1\">[Röst- und Versandtag festlegen]<\u002Fspan><\u002Fp><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n<\u002Fsc-if>\n\n\n<sc-if value=\"{{ isUeber }}\">\n<main id=\"main\">\n<section data-screen-label=\"Über uns · Hero\" data-dark=\"1\" style=\"position:relative; min-height:clamp(620px,92vh,900px); background:#1A1512; color:#FFFFFF; overflow:hidden; display:flex; align-items:flex-end;\">\n<img src=\"https://arhorbach-art.github.io/kaffee/assets/pages/andraschko_ueber-uns.jpg\" alt=\"Elisabeth und Willy Andraschko\" style=\"position:absolute; inset:0; width:100%; height:100%; object-fit:cover;\">\n<div aria-hidden=\"true\" style=\"position:absolute; inset:0; background:linear-gradient(0deg, rgba(26,21,18,.86) 0%, rgba(26,21,18,.4) 50%, rgba(26,21,18,.2) 100%);\"><\u002Fdiv>\n<div style=\"position:relative; width:100%; max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px); padding-top:180px; padding-bottom:clamp(56px,7vw,96px);\">\n<nav aria-label=\"Brotkrumen\" style=\"display:flex; gap:8px; font-size:14px; line-height:20px;\"><a href=\"#home\" sc-camel-on-click=\"{{ nav.home }}\" style=\"color:#FFFFFF; text-decoration:underline; text-underline-offset:3px;\">Start<\u002Fa><span aria-hidden=\"true\">/<\u002Fspan><a href=\"#roesterei\" sc-camel-on-click=\"{{ nav.roesterei }}\" style=\"color:#FFFFFF; text-decoration:underline; text-underline-offset:3px;\">Rösterei<\u002Fa><span aria-hidden=\"true\">/<\u002Fspan><span aria-current=\"page\">Über uns<\u002Fspan><\u002Fnav>\n<p style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; margin-top:32px;\">Willy und Elisabeth Andraschko · Lernt unsere Gründer kennen<\u002Fp>\n<h1 data-hl=\"1\" style=\"font-size:clamp(48px,7.6vw,112px); line-height:.98; font-weight:700; letter-spacing:-.03em; text-transform:lowercase; margin-top:16px; max-width:1000px;\">Die Alchemisten.<\u002Fh1>\n<p style=\"font-size:clamp(17px,1.25vw,19px); line-height:1.7; margin-top:28px; max-width:620px;\">„Das Kaffeehaus war eine der größten kulturellen Errungenschaften des 20. Jahrhunderts.“<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n<div style=\"background:#F1F1F1; color:#1A1512;\"><nav aria-label=\"Kapitel\" style=\"border-top:1px solid #DCDCDC; border-bottom:1px solid #DCDCDC;\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px); display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));\">\n<a href=\"#uu-1\" sc-camel-on-click=\"{{ chap.uu1 }}\" style=\"display:flex; gap:12px; align-items:baseline; padding:18px 0; color:inherit; font-size:15px; line-height:20px; font-weight:500;\" style-hover=\"color:#E3002B;\"><span style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; font-size:12px; color:#E3002B;\">01<\u002Fspan><span>Wien<\u002Fspan><\u002Fa>\n<a href=\"#uu-2\" sc-camel-on-click=\"{{ chap.uu2 }}\" style=\"display:flex; gap:12px; align-items:baseline; padding:18px 0; color:inherit; font-size:15px; line-height:20px; font-weight:500;\" style-hover=\"color:#E3002B;\"><span style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; font-size:12px; color:#E3002B;\">02<\u002Fspan><span>Café Einstein<\u002Fspan><\u002Fa>\n<a href=\"#uu-3\" sc-camel-on-click=\"{{ chap.uu3 }}\" style=\"display:flex; gap:12px; align-items:baseline; padding:18px 0; color:inherit; font-size:15px; line-height:20px; font-weight:500;\" style-hover=\"color:#E3002B;\"><span style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; font-size:12px; color:#E3002B;\">03<\u002Fspan><span>Eigene Röstung<\u002Fspan><\u002Fa>\n<a href=\"#uu-4\" sc-camel-on-click=\"{{ chap.uu4 }}\" style=\"display:flex; gap:12px; align-items:baseline; padding:18px 0; color:inherit; font-size:15px; line-height:20px; font-weight:500;\" style-hover=\"color:#E3002B;\"><span style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; font-size:12px; color:#E3002B;\">04<\u002Fspan><span>Die Manufaktur<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n<\u002Fnav><\u002Fdiv>\n<section id=\"uu-1\" data-screen-label=\"Über uns · 01 Wien\" style=\"background:#F7F7F7; padding:clamp(80px,10vw,152px) 0 clamp(80px,10vw,152px);\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px); display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); gap:clamp(40px,6vw,96px); align-items:start;\">\n<div><p style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; display:flex; gap:16px; align-items:center; color:#4A423B;\"><span style=\"color:#E3002B;\">01<\u002Fspan><span aria-hidden=\"true\" style=\"width:48px; height:1px; background:#E3002B;\"><\u002Fspan><span>Wien<\u002Fspan><\u002Fp><h2 data-hl=\"1\" style=\"font-size:clamp(34px,4.4vw,64px); line-height:1.04; font-weight:700; letter-spacing:-.02em; text-transform:lowercase; margin-top:28px;\">Kultur fand im Café statt.<\u002Fh2><\u002Fdiv>\n<div>\n<p style=\"font-size:clamp(17px,1.25vw,19px); line-height:1.7;\">Elisabeth und Willy Andraschko wuchsen beide in Wien auf. Zu der Zeit fand Kultur hauptsächlich in den Cafés statt. Das Café war ein Ort, an dem man Kunst und Musik genießen, über aktuelle Ereignisse sprechen, Freunde treffen, neue Bekanntschaften schließen oder einfach allein sein konnte.<\u002Fp>\n<blockquote style=\"margin:36px 0 0; padding:0 0 0 24px; border-left:1px solid #E3002B; font-size:clamp(22px,2vw,28px); line-height:1.4; font-weight:500;\">„Es waren magische Orte, wie eine Theaterbühne ohne Publikum. Etwas opulent, etwas verstaubt – etwas nutzlos – eine Atmosphäre, wie gemacht für Kaffee.“<\u002Fblockquote>\n<p style=\"font-size:clamp(17px,1.25vw,19px); line-height:1.7; margin-top:36px;\">Diese Kultur hatte Willy Andraschko verinnerlicht, als er nach Berlin zog und Ende der 70er Jahre ins später weltberühmte Café Einstein einstieg.<\u002Fp>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section id=\"uu-2\" data-screen-label=\"Über uns · 02 Café Einstein\" style=\"background:#F1F1F1; padding:clamp(80px,10vw,152px) 0 clamp(80px,10vw,152px);\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px);\">\n<p style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; display:flex; gap:16px; align-items:center; color:#4A423B;\"><span style=\"color:#E3002B;\">02<\u002Fspan><span aria-hidden=\"true\" style=\"width:48px; height:1px; background:#E3002B;\"><\u002Fspan><span>Café Einstein<\u002Fspan><\u002Fp>\n<h2 data-hl=\"1\" style=\"font-size:clamp(34px,4.4vw,64px); line-height:1.04; font-weight:700; letter-spacing:-.02em; text-transform:lowercase; margin-top:28px; max-width:900px;\">Treffpunkt für Literatur und Musik.<\u002Fh2>\n<p style=\"font-size:clamp(17px,1.25vw,19px); line-height:1.7; margin-top:28px; max-width:680px;\">Das Café Einstein wurde schnell zu einem Treffpunkt für die Literatur- und Musikszene, so wie die Paris Bar für die Kunstszene. Talentierte Künstler aus aller Welt tauchten auf – darunter Terry Riley, David Bowie und Nico von Velvet Underground.<\u002Fp>\n<div style=\"margin-top:clamp(48px,6vw,88px);\"><div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr)); gap:clamp(16px,2vw,32px); align-items:start;\">\n<img src=\"https://arhorbach-art.github.io/kaffee/assets/pages/1-about-us.jpg\" alt=\"Willy und Elisabeth Andraschko\" style=\"width:100%; height:auto; display:block;\">\n<img src=\"https://arhorbach-art.github.io/kaffee/assets/pages/2-about-us.jpg\" alt=\"Café Einstein\" style=\"width:100%; height:auto; display:block; margin-top:clamp(0px,8vw,120px);\">\n<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"uu-3\" data-screen-label=\"Über uns · 03 Eigene Röstung\" data-dark=\"1\" style=\"background:#E3002B; color:#FFFFFF; padding:clamp(80px,10vw,152px) 0 clamp(80px,10vw,152px);\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px);\">\n<p style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; display:flex; gap:16px; align-items:center; color:#FFFFFF;\"><span style=\"color:#FFFFFF;\">03<\u002Fspan><span aria-hidden=\"true\" style=\"width:48px; height:1px; background:#FFFFFF;\"><\u002Fspan><span>Eigene Röstung<\u002Fspan><\u002Fp>\n<p data-hl=\"1\" style=\"font-size:clamp(28px,3.4vw,48px); line-height:1.2; font-weight:500; letter-spacing:-.01em; margin-top:36px; max-width:1040px;\">„Es war schwierig, guten Kaffee zu bekommen. Die Bewegung ‚Specialty Coffee‘ steckte noch in den Kinderschuhen. Also beschlossen wir, unsere eigenen Bohnen zu rösten.“<\u002Fp>\n<div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); gap:clamp(32px,5vw,80px); margin-top:clamp(48px,6vw,80px); padding-top:clamp(32px,4vw,48px); border-top:1px solid rgba(255,255,255,.5);\">\n<p style=\"font-size:clamp(17px,1.25vw,19px); line-height:1.7;\">In den frühen 1990ern entschieden sich Willy und Elisabeth, einen Schritt weiterzugehen. Willy besuchte die Specialty Coffee Association in den USA, wir besichtigten italienische Röstereien und trafen Piero Bambi von La Marzocco – damals mit nur fünf Mitarbeitern.<\u002Fp>\n<p style=\"font-size:clamp(17px,1.25vw,19px); line-height:1.7;\">Selbst Starbucks und Peet’s Coffee hatten nur ein paar wenige Filialen. Wir reisten, lernten und rösteten. Nach über zwanzig Jahren Café Einstein widmeten sich die Andraschkos dann ausschließlich der Kunst des Kaffeeröstens.<\u002Fp>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section id=\"uu-4\" data-screen-label=\"Über uns · 04 Die Manufaktur\" style=\"background:#F7F7F7; padding:clamp(80px,10vw,152px) 0 clamp(56px,7vw,96px);\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px); display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); gap:clamp(40px,6vw,96px); align-items:start;\">\n<div><p style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; display:flex; gap:16px; align-items:center; color:#4A423B;\"><span style=\"color:#E3002B;\">04<\u002Fspan><span aria-hidden=\"true\" style=\"width:48px; height:1px; background:#E3002B;\"><\u002Fspan><span>Die Manufaktur<\u002Fspan><\u002Fp><h2 data-hl=\"1\" style=\"font-size:clamp(34px,4.4vw,64px); line-height:1.04; font-weight:700; letter-spacing:-.02em; text-transform:lowercase; margin-top:28px;\">Die größte der kleinen Röstereien.<\u002Fh2>\n<dl style=\"display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1px; margin:clamp(36px,4vw,56px) 0 0; background:#DCCFC2; border:1px solid #DCCFC2;\">\n<div style=\"background:#FFFFFF; padding:22px;\"><dt style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; font-size:12px; color:#4A423B;\">Fläche<\u002Fdt><dd style=\"margin:8px 0 0; font-size:clamp(28px,3vw,40px); line-height:1; font-weight:700;\">1500 m²<\u002Fdd><\u002Fdiv>\n<div style=\"background:#FFFFFF; padding:22px;\"><dt style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; font-size:12px; color:#4A423B;\">Im Monat<\u002Fdt><dd style=\"margin:8px 0 0; font-size:clamp(28px,3vw,40px); line-height:1; font-weight:700;\">20 t<\u002Fdd><\u002Fdiv>\n<\u002Fdl><\u002Fdiv>\n<div>\n<p style=\"font-size:clamp(17px,1.25vw,19px); line-height:1.7;\">Die Andraschko Kaffeemanufaktur produziert auf mehr als 1500 Quadratmetern monatlich 20 Tonnen perfekt abgestimmte Blends und sortenreine Kaffees. Die Manufaktur ist die größte der kleinen Röstereien, die sich ausschließlich auf Specialty Coffee in Deutschland konzentriert und den höchsten Standards der Specialty Coffee Associaton entspricht.<\u002Fp>\n<p style=\"font-size:clamp(17px,1.25vw,19px); line-height:1.7; margin-top:20px;\">Neben außergewöhnlichem Geschmack legt die Andraschko Kaffeemanufaktur Wert auf nachhaltigen Anbau und verantwortungsvolle Herstellung und setzt seit 2006 den Maßstab für Qualität, Direkthandel und erstklassige Verarbeitung. Die Andraschkos pflegen enge, persönliche Beziehungen zu all ihren Farmern, um korrekte Lieferketten und fairen Handel sicherzustellen.<\u002Fp>\n<p style=\"font-size:clamp(17px,1.25vw,19px); line-height:1.7; margin-top:20px; font-weight:500;\">Willy und Elisabeth sind in alle Belange des Andraschkogeschäfts involviert – von der Beschaffung der Bohnen über das Rösten bis hin zur Lieferung – und wollen Exzellenz für jede Tasse Kaffee.<\u002Fp>\n<div style=\"display:flex; flex-wrap:wrap; gap:16px; margin-top:40px;\"><a href=\"#specialty\" sc-camel-on-click=\"{{ nav.specialty }}\" style=\"display:inline-flex; align-items:center; justify-content:center; min-height:54px; padding:0 32px; border-radius:100px; background:#E3002B; color:#FFFFFF; font-size:15px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;\" style-hover=\"background:#C00018;\">Specialty Coffee<\u002Fa><a href=\"#roesterei\" sc-camel-on-click=\"{{ nav.roesterei }}\" style=\"display:inline-flex; align-items:center; justify-content:center; min-height:54px; padding:0 32px; border-radius:100px; border:1.5px solid #1A1512; color:#1A1512; font-size:15px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;\" style-hover=\"background:#1A1512; color:#FFFFFF;\">Die Rösterei<\u002Fa><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section aria-label=\"Bild\" style=\"background:#F7F7F7; padding:0 0 clamp(64px,8vw,120px);\"><div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px);\"><img src=\"https://arhorbach-art.github.io/kaffee/assets/pages/3-about-us.jpg\" alt=\"Die Andraschko Kaffeemanufaktur in Berlin\" style=\"width:100%; height:auto; display:block;\"><\u002Fdiv><\u002Fsection>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isSpecialty }}\">\n<main id=\"main\">\n<section data-screen-label=\"Specialty Coffee · Hero\" data-dark=\"1\" style=\"position:relative; min-height:clamp(620px,92vh,900px); background:#1A1512; color:#FFFFFF; overflow:hidden; display:flex; align-items:flex-end;\">\n<img src=\"https://arhorbach-art.github.io/kaffee/assets/pages/0-header-new.jpg\" alt=\"Specialty Coffee von Andraschko\" style=\"position:absolute; inset:0; width:100%; height:100%; object-fit:cover;\">\n<div aria-hidden=\"true\" style=\"position:absolute; inset:0; background:linear-gradient(0deg, rgba(26,21,18,.86) 0%, rgba(26,21,18,.4) 50%, rgba(26,21,18,.2) 100%);\"><\u002Fdiv>\n<div style=\"position:relative; width:100%; max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px); padding-top:180px; padding-bottom:clamp(56px,7vw,96px);\">\n<nav aria-label=\"Brotkrumen\" style=\"display:flex; gap:8px; font-size:14px; line-height:20px;\"><a href=\"#home\" sc-camel-on-click=\"{{ nav.home }}\" style=\"color:#FFFFFF; text-decoration:underline; text-underline-offset:3px;\">Start<\u002Fa><span aria-hidden=\"true\">/<\u002Fspan><a href=\"#roesterei\" sc-camel-on-click=\"{{ nav.roesterei }}\" style=\"color:#FFFFFF; text-decoration:underline; text-underline-offset:3px;\">Rösterei<\u002Fa><span aria-hidden=\"true\">/<\u002Fspan><span aria-current=\"page\">Specialty Coffee<\u002Fspan><\u002Fnav>\n<p style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; margin-top:32px;\">Specialty Coffee<\u002Fp>\n<h1 data-hl=\"1\" style=\"font-size:clamp(48px,7.6vw,112px); line-height:.98; font-weight:700; letter-spacing:-.03em; text-transform:lowercase; margin-top:16px; max-width:1000px;\">Wir finden Farmer, die Specialty Coffee kultivieren.<\u002Fh1>\n<p style=\"font-size:clamp(17px,1.25vw,19px); line-height:1.7; margin-top:28px; max-width:620px;\">Wir arbeiten eng mit ihnen zusammen und motivieren sie dazu, auch in Zukunft einzigartigen und hochwertigen Kaffee anzubauen.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n<div style=\"background:#F1F1F1; color:#1A1512;\"><nav aria-label=\"Kapitel\" style=\"border-top:1px solid #DCDCDC; border-bottom:1px solid #DCDCDC;\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px); display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));\">\n<a href=\"#sp-1\" sc-camel-on-click=\"{{ chap.sp1 }}\" style=\"display:flex; gap:12px; align-items:baseline; padding:18px 0; color:inherit; font-size:15px; line-height:20px; font-weight:500;\" style-hover=\"color:#E3002B;\"><span style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; font-size:12px; color:#E3002B;\">01<\u002Fspan><span>Die Rösterei<\u002Fspan><\u002Fa>\n<a href=\"#sp-2\" sc-camel-on-click=\"{{ chap.sp2 }}\" style=\"display:flex; gap:12px; align-items:baseline; padding:18px 0; color:inherit; font-size:15px; line-height:20px; font-weight:500;\" style-hover=\"color:#E3002B;\"><span style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; font-size:12px; color:#E3002B;\">02<\u002Fspan><span>Die SCA<\u002Fspan><\u002Fa>\n<a href=\"#sp-3\" sc-camel-on-click=\"{{ chap.sp3 }}\" style=\"display:flex; gap:12px; align-items:baseline; padding:18px 0; color:inherit; font-size:15px; line-height:20px; font-weight:500;\" style-hover=\"color:#E3002B;\"><span style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; font-size:12px; color:#E3002B;\">03<\u002Fspan><span>Die Farmer<\u002Fspan><\u002Fa>\n<a href=\"#sp-4\" sc-camel-on-click=\"{{ chap.sp4 }}\" style=\"display:flex; gap:12px; align-items:baseline; padding:18px 0; color:inherit; font-size:15px; line-height:20px; font-weight:500;\" style-hover=\"color:#E3002B;\"><span style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; font-size:12px; color:#E3002B;\">04<\u002Fspan><span>Das Produkt<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n<\u002Fnav><\u002Fdiv>\n<section id=\"sp-1\" data-screen-label=\"Specialty · 01 Rösterei\" style=\"background:#F7F7F7; padding:clamp(80px,10vw,152px) 0 clamp(80px,10vw,152px);\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px);\"><p style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; display:flex; gap:16px; align-items:center; color:#4A423B;\"><span style=\"color:#E3002B;\">01<\u002Fspan><span aria-hidden=\"true\" style=\"width:48px; height:1px; background:#E3002B;\"><\u002Fspan><span>Die Rösterei<\u002Fspan><\u002Fp>\n<p data-hl=\"1\" style=\"font-size:clamp(28px,3.4vw,48px); line-height:1.2; font-weight:500; letter-spacing:-.01em; margin-top:36px; max-width:1080px;\">Andraschko Kaffee ist die größte kleinste Rösterei für Spezialitätenkaffee in Deutschland, die höchste Standards in der Beschaffung und Produktion von Kaffee setzt.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n<section id=\"sp-2\" data-screen-label=\"Specialty · 02 SCA\" style=\"background:#F1F1F1; padding:clamp(80px,10vw,152px) 0 clamp(80px,10vw,152px);\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px); display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); gap:clamp(40px,6vw,96px); align-items:start;\">\n<div><p style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; display:flex; gap:16px; align-items:center; color:#4A423B;\"><span style=\"color:#E3002B;\">02<\u002Fspan><span aria-hidden=\"true\" style=\"width:48px; height:1px; background:#E3002B;\"><\u002Fspan><span>Die SCA<\u002Fspan><\u002Fp><h2 data-hl=\"1\" style=\"font-size:clamp(34px,4.4vw,64px); line-height:1.04; font-weight:700; letter-spacing:-.02em; text-transform:lowercase; margin-top:28px;\">Maßstäbe seit 1982.<\u002Fh2><img src=\"https://arhorbach-art.github.io/kaffee/assets/pages/andraschko-siegel-sca.svg\" alt=\"Specialty Coffee Association\" style=\"display:block; width:140px; height:auto; margin-top:40px;\"><\u002Fdiv>\n<div>\n<p style=\"font-size:clamp(17px,1.25vw,19px); line-height:1.7;\">Die Specialty Coffee Association (SCA) bestimmt seit 1982 die Maßstäbe für fair gehandelten Kaffee und höchste Qualitätsansprüche. Sie ist eine gemeinnützige Mitgliederorganisation, die Gemeinschaften von globalen Kaffeeexperten und die Werte Nachhaltigkeit, Gerechtigkeit und Qualität fördert.<\u002Fp>\n<p style=\"font-size:clamp(17px,1.25vw,19px); line-height:1.7; margin-top:20px;\">Seit den frühen 1980er Jahren engagiert sich SCA für das Setzen von Standards, Förderung von Bildung und die Zusammenführung von Communitys weltweit, um die Beschaffung und damit auch die Zubereitung von Kaffee zu verbessern. Die Association hat umfassende Bewertungskriterien für Rohkaffee festgelegt und setzt auf Nachhaltigkeit in der gesamten Lieferkette. Heute sind die Kaffeefachleute der Vereinigung weltweit vereint in ihrem Bestreben, Wissen zu teilen und eine nachhaltige Zukunft für Kaffee zu garantieren.<\u002Fp>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section id=\"sp-3\" data-screen-label=\"Specialty · 03 Farmer\" style=\"background:#F7F7F7; padding:clamp(80px,10vw,152px) 0 clamp(80px,10vw,152px);\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px);\">\n<div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); gap:clamp(40px,6vw,96px); align-items:start;\"><div><p style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; display:flex; gap:16px; align-items:center; color:#4A423B;\"><span style=\"color:#E3002B;\">03<\u002Fspan><span aria-hidden=\"true\" style=\"width:48px; height:1px; background:#E3002B;\"><\u002Fspan><span>Die Farmer<\u002Fspan><\u002Fp><h2 data-hl=\"1\" style=\"font-size:clamp(34px,4.4vw,64px); line-height:1.04; font-weight:700; letter-spacing:-.02em; text-transform:lowercase; margin-top:28px;\">Von Südindien bis Kenia.<\u002Fh2><\u002Fdiv>\n<p style=\"font-size:clamp(17px,1.25vw,19px); line-height:1.7;\">Die Andraschkos traten der SCA in den 1990er Jahren bei. Sie reisen weiterhin regelmäßig In Sachen Kaffee von Südindien über Mittelamerika, von Brasilien bis Kenia. Sie wissen, dass das wahre Verständnis für Kaffee auf dem Erfahrungsschatz des jeweiligen Landes beruht, in dem er angebaut wird.<\u002Fp><\u002Fdiv>\n<div style=\"margin-top:clamp(48px,6vw,88px);\"><div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr)); gap:clamp(16px,2vw,32px); align-items:start;\">\n<img src=\"https://arhorbach-art.github.io/kaffee/assets/pages/1-specialty-coffee.jpg\" alt=\"Specialty Coffee\" style=\"width:100%; height:auto; display:block;\">\n<img src=\"https://arhorbach-art.github.io/kaffee/assets/pages/2-specialty-coffee.jpg\" alt=\"Specialty Coffee\" style=\"width:100%; height:auto; display:block; margin-top:clamp(0px,8vw,120px);\">\n<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section data-screen-label=\"Specialty · Zitat\" data-dark=\"1\" style=\"background:#E3002B; color:#FFFFFF; padding:clamp(80px,10vw,152px) 0 clamp(80px,10vw,152px);\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px);\">\n<blockquote style=\"margin:0; font-size:clamp(28px,3.6vw,52px); line-height:1.18; font-weight:500; letter-spacing:-.01em; max-width:1100px;\">„Wir machen besondere Kaffeebauern ausfindig, arbeiten eng mit ihnen zusammen und motivieren sie, einzigartige, qualitativ hochwertige Kaffeebohnen anzubauen.“<\u002Fblockquote>\n<p style=\"font-size:clamp(17px,1.25vw,19px); line-height:1.7; margin-top:36px; max-width:680px;\">Diese langjährigen Beziehungen zu den Farmern garantieren die hohen Standards bei der Kultivierung von Kaffee, den fairen Handel und Transparenz.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"sp-4\" data-screen-label=\"Specialty · 04 Produkt\" style=\"background:#F1F1F1; padding:clamp(80px,10vw,152px) 0 clamp(56px,7vw,96px);\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px); display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); gap:clamp(40px,6vw,96px); align-items:end;\">\n<div><p style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; display:flex; gap:16px; align-items:center; color:#4A423B;\"><span style=\"color:#E3002B;\">04<\u002Fspan><span aria-hidden=\"true\" style=\"width:48px; height:1px; background:#E3002B;\"><\u002Fspan><span>Das Produkt<\u002Fspan><\u002Fp><p data-hl=\"1\" style=\"font-size:clamp(26px,2.8vw,40px); line-height:1.25; font-weight:500; margin-top:36px;\">Specialty Coffee bei Andraschko Kaffee ist ein einzigartiges Produkt, das aus jahrelanger Erfahrung, handwerklichem Können und einem Engagement für die sorgfältige Auswahl der besten Kaffeesorten entstand.<\u002Fp><\u002Fdiv>\n<div style=\"display:flex; flex-wrap:wrap; gap:16px;\"><a href=\"#sortiment\" sc-camel-on-click=\"{{ nav.sortiment }}\" style=\"display:inline-flex; align-items:center; justify-content:center; min-height:54px; padding:0 32px; border-radius:100px; background:#E3002B; color:#FFFFFF; font-size:15px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;\" style-hover=\"background:#C00018;\">Sortiment entdecken<\u002Fa><a href=\"#ueber-uns\" sc-camel-on-click=\"{{ nav.ueber }}\" style=\"display:inline-flex; align-items:center; justify-content:center; min-height:54px; padding:0 32px; border-radius:100px; border:1.5px solid #1A1512; color:#1A1512; font-size:15px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;\" style-hover=\"background:#1A1512; color:#FFFFFF;\">Über uns<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section aria-label=\"Bild\" style=\"background:#F1F1F1; padding:0 0 clamp(64px,8vw,120px);\"><div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px);\"><img src=\"https://arhorbach-art.github.io/kaffee/assets/pages/3-specialty-coffee.jpg\" alt=\"Specialty Coffee von Andraschko\" style=\"width:100%; height:auto; display:block;\"><\u002Fdiv><\u002Fsection>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isRoesterei }}\">\n<main id=\"main\">\n\n<section data-screen-label=\"Rösterei · Hero\" data-dark=\"1\" style=\"position:relative; min-height:clamp(600px,88vh,860px); background:#1A1512; color:#FFFFFF; overflow:hidden; display:flex; align-items:flex-end;\">\n<img src=\"https://arhorbach-art.github.io/kaffee/assets/r-hero.jpg\" alt=\"Die Rösterei der Andraschko Kaffeemanufaktur in Berlin-Tempelhof\" style=\"position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 50%;\">\n<div aria-hidden=\"true\" style=\"position:absolute; inset:0; background:linear-gradient(0deg, rgba(26,21,18,.78) 0%, rgba(26,21,18,.35) 45%, rgba(26,21,18,.15) 100%);\"><\u002Fdiv>\n<div style=\"position:relative; width:100%; max-width:1280px; margin:0 auto; padding:180px clamp(20px,3.5vw,40px) clamp(56px,7vw,96px);\">\n<nav aria-label=\"Brotkrumen\" style=\"display:flex; gap:8px; font-size:14px; line-height:20px;\">\n<a href=\"#home\" sc-camel-on-click=\"{{ nav.home }}\" style=\"color:#FFFFFF; text-decoration:underline; text-underline-offset:3px;\">Start<\u002Fa><span aria-hidden=\"true\">/<\u002Fspan><span aria-current=\"page\">Rösterei<\u002Fspan>\n<\u002Fnav>\n<p style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; margin-top:32px;\">Innovatives Handwerk · Specialty Coffee Rösterei<\u002Fp>\n<h1 data-hl=\"1\" style=\"font-size:clamp(44px,6.4vw,92px); line-height:1; font-weight:700; letter-spacing:-.025em; text-transform:lowercase; margin-top:16px; max-width:900px;\">Unsere Rösterei.<\u002Fh1>\n<div style=\"display:flex; flex-wrap:wrap; gap:16px; width:fit-content; max-width:100%; margin-top:40px;\">\n<a href=\"#roesterei-geschichte\" sc-camel-on-click=\"{{ nav.roestereiStory }}\" style=\"display:inline-flex; align-items:center; justify-content:center; min-height:54px; padding:0 clamp(24px,2.5vw,36px); border-radius:100px; background:#E3002B; color:#FFFFFF; font-size:clamp(14px,1.05vw,15px); font-weight:700; letter-spacing:.06em; text-transform:uppercase; text-align:center; flex:1 1 auto;\" style-hover=\"background:#FC0030; color:#FFFFFF;\">Unsere Geschichte<\u002Fa>\n<a href=\"#signature-blends\" sc-camel-on-click=\"{{ nav.roestereiBlends }}\" style=\"display:inline-flex; align-items:center; justify-content:center; min-height:54px; padding:0 clamp(24px,2.5vw,36px); border-radius:100px; border:1.5px solid #FFFFFF; color:#FFFFFF; font-size:clamp(14px,1.05vw,15px); font-weight:700; letter-spacing:.06em; text-transform:uppercase; text-align:center; flex:1 1 auto;\" style-hover=\"background:#FFFFFF; color:#1A1512;\">Signature Blends<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"roesterei-geschichte\" data-screen-label=\"Rösterei · Geschichte\" style=\"background:#F7F7F7; padding:clamp(72px,8.4vw,120px) 0;\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px); display:flex; flex-wrap:wrap; align-items:flex-start; gap:clamp(40px,6vw,96px);\">\n<div style=\"flex:5 1 340px; max-width:560px;\">\n<p style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; color:#4A423B;\">Seit 2006 in Tempelhof<\u002Fp>\n<h2 data-hl=\"1\" style=\"font-size:clamp(32px,3.9vw,56px); line-height:1.07; font-weight:700; letter-spacing:-.015em; text-transform:lowercase; margin-top:16px;\">Der lange Weg zum kurzen Schwarzen.<\u002Fh2>\n<p style=\"font-size:clamp(17px,1.25vw,18px); line-height:1.6; margin-top:24px; text-wrap:pretty;\">Unsere Geschichte mit Kaffee begann lange vor unserer Rösterei. Für unser Kaffeehaus (Einstein) führte uns die Suche nach wirklich gutem Espresso nach Italien, wo Andrea Trinci unser Verständnis von Herkunft, Blending und Röstung entscheidend prägte.<\u002Fp>\n<p style=\"font-size:clamp(17px,1.25vw,18px); line-height:1.6; margin-top:16px; text-wrap:pretty;\">Es war, wie Thomas Platt einmal über uns schrieb, „der lange Weg zum kurzen Schwarzen“. Dieser Weg führte schließlich zu unserer Rösterei in Berlin. Heute zählt sie zu den größten Specialty Coffee Röstereien Deutschlands – und ist dennoch ein Ort des Handwerks geblieben.<\u002Fp>\n<p style=\"font-size:clamp(17px,1.25vw,18px); line-height:1.6; margin-top:16px; text-wrap:pretty;\">Hier arbeiten Menschen an Rezepten, beobachten, probieren und verändern. Sie arbeiten mit Temperatur und Zeit, mit Erfahrung und Neugier – und mit der Überzeugung, die Dinge so lange zu verfeinern, bis sie richtig sind. Vieles hat seinen Ursprung in dem, was wir in Italien gelernt haben. Anderes ist über die Jahre dazugekommen und entwickelt sich bis heute weiter. So entstehen in Tempelhof unsere ausbalancierten Blends und charaktervollen Single Origins.<\u002Fp>\n<div style=\"display:flex; flex-wrap:wrap; gap:16px; width:fit-content; max-width:100%; margin-top:40px;\">\n<a href=\"#bestseller\" sc-camel-on-click=\"{{ nav.homeBest }}\" style=\"display:inline-flex; align-items:center; justify-content:center; min-height:54px; padding:0 clamp(24px,2.5vw,36px); border-radius:100px; background:#1A1512; color:#FFFFFF; font-size:clamp(14px,1.05vw,15px); font-weight:700; letter-spacing:.06em; text-transform:uppercase; text-align:center; flex:1 1 auto;\" style-hover=\"background:#3B3532; color:#FFFFFF;\">Kaffee kaufen<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:7 1 460px; min-width:0; position:relative;\">\n<img src=\"https://arhorbach-art.github.io/kaffee/assets/r-packaging.jpg\" alt=\"Frisch gerösteter Kaffee wird in der Rösterei verpackt\" style=\"width:100%; aspect-ratio:4/5; object-fit:cover; display:block;\">\n<img src=\"https://arhorbach-art.github.io/kaffee/assets/r-badge.svg\" alt=\"Andraschko Rösterei Siegel\" style=\"position:absolute; left:clamp(-48px,-3vw,-16px); bottom:clamp(-48px,-3vw,-16px); width:clamp(96px,11vw,148px); height:auto; display:block;\">\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Rösterei · Zitat\" data-dark=\"1\" style=\"background:#E3002B; color:#FFFFFF; padding:clamp(72px,8.4vw,120px) 0;\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px);\">\n<blockquote style=\"margin:0; max-width:1040px;\">\n<p data-hl=\"1\" style=\"font-size:clamp(30px,4.2vw,60px); line-height:1.1; font-weight:700; letter-spacing:-.015em; text-transform:lowercase; text-wrap:balance;\">„Traditionelles Handwerk, innovative Produktionsprozesse und Jahrzehnte lange Erfahrung. Bei uns entsteht Magie.“<\u002Fp>\n<footer style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; margin-top:32px;\">Willy &amp; Elisabeth Andraschko<\u002Ffooter>\n<\u002Fblockquote>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Rösterei · Potenzial\" style=\"background:#F7F7F7; padding:clamp(72px,8.4vw,120px) 0;\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px); display:grid; gap:clamp(56px,7vw,96px);\">\n<div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:clamp(32px,5vw,80px);\">\n<div style=\"flex:1 1 360px; min-width:0;\">\n<img src=\"https://arhorbach-art.github.io/kaffee/assets/r-potential.jpg\" alt=\"Frisch geröstete Kaffeebohnen\" style=\"width:100%; aspect-ratio:1/1; object-fit:cover; display:block;\">\n<\u002Fdiv>\n<div style=\"flex:1 1 360px; max-width:520px;\">\n<p style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; color:#4A423B;\">Röstung<\u002Fp>\n<h2 data-hl=\"1\" style=\"font-size:clamp(32px,3.9vw,56px); line-height:1.07; font-weight:700; letter-spacing:-.015em; text-transform:lowercase; margin-top:16px;\">Das Potenzial ausreizen.<\u002Fh2>\n<p style=\"font-size:clamp(17px,1.25vw,18px); line-height:1.6; margin-top:24px; text-wrap:pretty;\">Der Röstprozess bringt das volle Potenzial jeder Bohne zur Geltung. Hochwertige Bohnen sind fundamental, wahre Handwerkskunst jedoch zeigt sich dann im Rösten. „In dieser Phase testen, schmecken und verfeinern wir jede Mischung; wir erwecken unsere Signature-Kaffees – wie die Wiener Kaffeehausmischung, Bar Italia und Grand Cru – zum Leben.“<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex; flex-wrap:wrap; flex-direction:row-reverse; align-items:center; gap:clamp(32px,5vw,80px); border-top:1px solid #E9DFD4; padding-top:clamp(56px,7vw,96px);\">\n<div style=\"flex:1 1 320px; max-width:460px; min-width:0;\">\n<img src=\"https://arhorbach-art.github.io/kaffee/assets/r-bambi.jpg\" alt=\"Piero Bambi von La Marzocco mit Willy Andraschko\" style=\"width:100%; aspect-ratio:3/4; object-fit:cover; display:block;\">\n<\u002Fdiv>\n<blockquote style=\"flex:1 1 400px; max-width:640px; margin:0;\">\n<p style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; color:#4A423B;\">Ende der 1990er<\u002Fp>\n<p style=\"font-size:clamp(20px,1.8vw,26px); line-height:1.45; font-weight:500; margin-top:20px; text-wrap:pretty;\">„Es waren die späten 1990er Jahre, und wir hatten große Probleme, guten Kaffee zu bekommen. Die Specialty Coffee Bewegung steckte noch in den Kinderschuhen. Also beschlossen wir, unsere eigenen Bohnen zu rösten. Willy besuchte die Specialty Coffee Association-Kongresse in den USA. Wir besichtigten italienische Röstereien. Bei La Marzocco trafen wir Piero Bambi – der zu diesem Zeitpunkt nur fünf Angestellte beschäftigte. Starbucks und Peet’s Coffee hatten damals auch nur ein paar Filialen. Wir reisten, lernten, rösteten Kaffee. Und diese Erfahrungen sowie Expertise bringen wir heute ein.“<\u002Fp>\n<footer style=\"display:flex; align-items:center; gap:12px; margin-top:28px; font-size:16px; font-weight:700;\"><span aria-hidden=\"true\" style=\"width:32px; height:2px; background:#E3002B;\"><\u002Fspan>Elisabeth Andraschko<\u002Ffooter>\n<\u002Fblockquote>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Rösterei · Prozess\" data-dark=\"1\" style=\"background:#1A1512; color:#FFFFFF; padding:clamp(72px,8.4vw,120px) 0;\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px); display:flex; flex-wrap:wrap; align-items:center; gap:clamp(40px,6vw,96px);\">\n<div style=\"flex:5 1 340px; max-width:560px;\">\n<p style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; color:#F1F1F1;\">Probat · seit 1868<\u002Fp>\n<h2 data-hl=\"1\" style=\"font-size:clamp(32px,3.9vw,56px); line-height:1.07; font-weight:700; letter-spacing:-.015em; text-transform:lowercase; margin-top:16px;\">Den Prozess perfektionieren.<\u002Fh2>\n<p style=\"font-size:clamp(17px,1.25vw,18px); line-height:1.6; margin-top:24px; text-wrap:pretty;\">Wir arbeiten ausschließlich mit Probat Röstmaschinen. Probat wurde 1868 gegründet und ist heute ein führendes Unternehmen im Bereich der Kaffeeverarbeitung und -technologie. Probat-Röstmaschinen stehen für eine präzise Zusammensetzung aus Wärmeleitung, Strahlung und Konvektion, die durch Gusseisenkomponenten ermöglicht wird.<\u002Fp>\n<p style=\"font-size:clamp(17px,1.25vw,18px); line-height:1.6; margin-top:16px; text-wrap:pretty;\">Espresso-Röstung braucht Zeit, um die Aromen und den Geschmack der Bohnen durch die Maillard-Reaktion vollständig zu entfalten. Probat-Röstmaschinen sind nicht auf Schnelligkeit ausgelegt. Und genau darin liegt das Geheimnis von Andraschko Kaffee.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:7 1 460px; min-width:0; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; align-items:end;\">\n<img src=\"https://arhorbach-art.github.io/kaffee/assets/r-probat.jpg\" alt=\"Probat Röstmaschine in der Rösterei\" style=\"width:100%; aspect-ratio:2/3; object-fit:cover; display:block;\">\n<img src=\"https://arhorbach-art.github.io/kaffee/assets/r-roastery.jpg\" alt=\"Blick in die Rösterei in Tempelhof\" style=\"width:100%; aspect-ratio:3/4; object-fit:cover; display:block;\">\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"signature-blends\" data-screen-label=\"Rösterei · Signature Blends\" style=\"background:#F1F1F1; padding:clamp(72px,8.4vw,120px) 0;\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px);\">\n<div style=\"display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:24px 64px;\">\n<div style=\"flex:1 1 360px; max-width:560px;\">\n<p style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; color:#4A423B;\">Signature Blends<\u002Fp>\n<h2 data-hl=\"1\" style=\"font-size:clamp(32px,3.9vw,56px); line-height:1.07; font-weight:700; letter-spacing:-.015em; text-transform:lowercase; margin-top:16px;\">Jahrelang gefeilt.<\u002Fh2>\n<\u002Fdiv>\n<p style=\"flex:1 1 360px; max-width:560px; font-size:clamp(17px,1.25vw,18px); line-height:1.6; text-wrap:pretty;\">Wir haben jahrelang an unseren Signature Blends gefeilt, um den perfekten Geschmack herauszufiltern. In einem Blend werden die Eigenschaften der einzelnen Kaffeesorten so betont, dass ihre Qualität hervorsticht. Blends erfordern Kunstfertigkeit, Augenmerk auf Röstprozesse und Rohkaffee, sowie Erfahrung.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr)); gap:24px; margin-top:clamp(40px,5vw,64px);\">\n<article style=\"background:#FFFFFF; display:flex; flex-direction:column;\">\n<div style=\"aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; overflow:hidden;\"><img src=\"https://arhorbach-art.github.io/kaffee/assets/pack-buenavista.jpg?v=3\" alt=\"Packung Buena Vista Primèro Espresso Blend\" style=\"width:58%; height:auto; display:block;\"><\u002Fdiv>\n<div style=\"padding:24px clamp(20px,2vw,28px) 28px; border-top:1px solid #E9DFD4; display:flex; flex-direction:column; flex:1;\">\n<h3 style=\"font-size:22px; line-height:1.3; font-weight:500;\">Buena Vista Primèro Espresso Blend<\u002Fh3>\n<p style=\"font-size:15px; line-height:22px; color:#4A423B; margin-top:6px;\">Brauner Zucker · Schokolade · Zimt<\u002Fp>\n<p style=\"display:flex; align-items:baseline; gap:10px; margin-top:16px; padding-bottom:20px;\"><span style=\"font-size:20px; font-weight:700;\">14,13 €<\u002Fspan><span style=\"font-size:14px; color:#4A423B;\">56,52 €/kg<\u002Fspan><\u002Fp>\n<a href=\"#produkt\" sc-camel-on-click=\"{{ openP.bv }}\" style=\"display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:0 24px; margin-top:auto; border-radius:100px; border:1.5px solid #1A1512; color:#1A1512; font-size:14px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;\" style-hover=\"background:#C00018; color:#FFFFFF;\">Auswählen<\u002Fa>\n<\u002Fdiv>\n<\u002Farticle>\n<article style=\"background:#FFFFFF; display:flex; flex-direction:column;\">\n<div style=\"aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; overflow:hidden;\"><img src=\"https://arhorbach-art.github.io/kaffee/assets/pack-malabar.jpg?v=3\" alt=\"Packung Malabar Monsoon Espresso Blend\" style=\"width:58%; height:auto; display:block;\"><\u002Fdiv>\n<div style=\"padding:24px clamp(20px,2vw,28px) 28px; border-top:1px solid #E9DFD4; display:flex; flex-direction:column; flex:1;\">\n<h3 style=\"font-size:22px; line-height:1.3; font-weight:500;\">Malabar Monsoon Espresso Blend<\u002Fh3>\n<p style=\"font-size:15px; line-height:22px; color:#4A423B; margin-top:6px;\">Nektarine · Honig · Haselnuss<\u002Fp>\n<p style=\"display:flex; align-items:baseline; gap:10px; margin-top:16px; padding-bottom:20px;\"><span style=\"font-size:20px; font-weight:700;\">9,73 €<\u002Fspan><span style=\"font-size:14px; color:#4A423B;\">38,92 €/kg<\u002Fspan><\u002Fp>\n<a href=\"#produkt\" sc-camel-on-click=\"{{ openP.mm }}\" style=\"display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:0 24px; margin-top:auto; border-radius:100px; border:1.5px solid #1A1512; color:#1A1512; font-size:14px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;\" style-hover=\"background:#C00018; color:#FFFFFF;\">Auswählen<\u002Fa>\n<\u002Fdiv>\n<\u002Farticle>\n<article style=\"background:#FFFFFF; display:flex; flex-direction:column;\">\n<div style=\"aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; overflow:hidden;\"><img src=\"https://arhorbach-art.github.io/kaffee/assets/pack-roasterspick.png?v=3\" alt=\"Packung Roasters Pick Espresso Blend\" style=\"width:58%; height:auto; display:block;\"><\u002Fdiv>\n<div style=\"padding:24px clamp(20px,2vw,28px) 28px; border-top:1px solid #E9DFD4; display:flex; flex-direction:column; flex:1;\">\n<h3 style=\"font-size:22px; line-height:1.3; font-weight:500;\">Roasters Pick Espresso Blend<\u002Fh3>\n<p style=\"font-size:15px; line-height:22px; color:#4A423B; margin-top:6px;\">leichte Süße · Nektarine · balanced<\u002Fp>\n<p style=\"display:flex; align-items:baseline; gap:10px; margin-top:16px; padding-bottom:20px;\"><span style=\"font-size:20px; font-weight:700;\">37,54 €<\u002Fspan><span style=\"font-size:14px; color:#4A423B;\">37,54 €/kg<\u002Fspan><\u002Fp>\n<a href=\"#produkt\" sc-camel-on-click=\"{{ openP.rp }}\" style=\"display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:0 24px; margin-top:auto; border-radius:100px; border:1.5px solid #1A1512; color:#1A1512; font-size:14px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;\" style-hover=\"background:#C00018; color:#FFFFFF;\">Auswählen<\u002Fa>\n<\u002Fdiv>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"roesterei-geschmack\" data-screen-label=\"Rösterei · Geschmacksrad\" style=\"background:#F7F7F7; padding:clamp(72px,8.4vw,120px) 0;\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px);\">\n<div style=\"max-width:720px;\">\n<p style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; color:#4A423B;\">Geschmacksrad<\u002Fp>\n<h2 data-hl=\"1\" style=\"font-size:clamp(32px,3.9vw,56px); line-height:1.07; font-weight:700; letter-spacing:-.015em; text-transform:lowercase; margin-top:16px;\">Unsere Mischungen im Geschmacksrad.<\u002Fh2>\n<p style=\"font-size:clamp(17px,1.25vw,18px); line-height:1.6; margin-top:24px; max-width:640px;\">Jede Mischung hat drei Leitaromen. Tippen Sie auf ein Aroma, um zu sehen, wo es vorkommt.<\u002Fp>\n<\u002Fdiv>\n<div style=\"margin-top:clamp(40px,5vw,64px);\">\n<dc-import name=\"Aroma Wheel\" mode=\"finder\" coffees=\"{{ wheelCoffees }}\" on-open=\"{{ openProduct }}\" on-quick=\"{{ quickOpen }}\" action-label=\"Entdecken\" surface=\"#FFFFFF\" hint-size=\"100%,600px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Rösterei · Werte\" style=\"background:#F1F1F1; padding:clamp(72px,8.4vw,120px) 0;\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px); display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:clamp(32px,3vw,48px) 24px;\">\n<article>\n<img src=\"https://arhorbach-art.github.io/kaffee/assets/r-qualitaet.jpg\" alt=\"Kaffeefarm im Ursprung\" style=\"width:100%; aspect-ratio:4/5; object-fit:cover; display:block;\">\n<h2 data-hl=\"1\" style=\"font-size:clamp(26px,2.4vw,34px); line-height:1.15; font-weight:700; letter-spacing:-.01em; text-transform:lowercase; margin-top:24px;\">Qualität<\u002Fh2>\n<p style=\"font-size:17px; line-height:27px; margin-top:12px; text-wrap:pretty;\">Wir rösten nicht nur auf höchstem Niveau. Auch unsere Partner, die Farmern und Farmerinnen im Ursprung teilen unsere Ansprüche und sorgen mit ihrer Sorgfalt und ihrem Knowhow für beste Qualitäten.<\u002Fp>\n<\u002Farticle>\n<article>\n<img src=\"https://arhorbach-art.github.io/kaffee/assets/r-ethik.jpg\" alt=\"Partner im Ursprungsland\" style=\"width:100%; aspect-ratio:4/5; object-fit:cover; display:block;\">\n<h2 data-hl=\"1\" style=\"font-size:clamp(26px,2.4vw,34px); line-height:1.15; font-weight:700; letter-spacing:-.01em; text-transform:lowercase; margin-top:24px;\">Ethik<\u002Fh2>\n<p style=\"font-size:17px; line-height:27px; margin-top:12px; text-wrap:pretty;\">Unsere Philosophie des respektvollen und nachhaltigen Umgangs fängt bei den Farmern und Farmerinnen an, gilt ebenso für unser Team und hört beim Kunden nicht auf.<\u002Fp>\n<\u002Farticle>\n<article>\n<img src=\"https://arhorbach-art.github.io/kaffee/assets/r-frische.jpg\" alt=\"Frisch gerösteter Kaffee\" style=\"width:100%; aspect-ratio:4/5; object-fit:cover; display:block;\">\n<h2 data-hl=\"1\" style=\"font-size:clamp(26px,2.4vw,34px); line-height:1.15; font-weight:700; letter-spacing:-.01em; text-transform:lowercase; margin-top:24px;\">Frische<\u002Fh2>\n<p style=\"font-size:17px; line-height:27px; margin-top:12px; text-wrap:pretty;\">From farm to cup: von uns persönlich im Ursprung ausgesucht. Nach dem Cuppen und unserer Qualitätskontrolle kommt der Kaffee frisch geröstet direkt zu Ihnen.<\u002Fp>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Rösterei · Für Betriebe\" data-dark=\"1\" style=\"background:#1A1512; color:#FFFFFF; padding:clamp(56px,6vw,88px) 0;\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px); display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:32px 64px;\">\n<div style=\"flex:1 1 420px; max-width:640px;\">\n<p style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; color:#F1F1F1;\">Für Gastronomie, Hotel &amp; Büro<\u002Fp>\n<h2 data-hl=\"1\" style=\"font-size:clamp(28px,3vw,44px); line-height:1.1; font-weight:700; letter-spacing:-.015em; text-transform:lowercase; margin-top:14px;\">Verkostung in der Rösterei.<\u002Fh2>\n<p style=\"font-size:clamp(17px,1.25vw,18px); line-height:1.6; margin-top:16px;\">In der Rösterei in Tempelhof oder bei Ihnen: Wir verkosten die Kaffees, die zu Ihrem Angebot passen.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex; flex-wrap:wrap; gap:16px; width:fit-content; max-width:100%;\">\n<a href=\"#kontakt\" sc-camel-on-click=\"{{ book.verkostung }}\" style=\"display:inline-flex; align-items:center; justify-content:center; min-height:54px; padding:0 clamp(24px,2.5vw,36px); border-radius:100px; background:#E3002B; color:#FFFFFF; font-size:clamp(14px,1.05vw,15px); font-weight:700; letter-spacing:.06em; text-transform:uppercase; text-align:center; flex:1 1 auto;\" style-hover=\"background:#FC0030; color:#FFFFFF;\">Verkostung buchen<\u002Fa>\n<a href=\"#b2b\" sc-camel-on-click=\"{{ nav.b2b }}\" style=\"display:inline-flex; align-items:center; justify-content:center; min-height:54px; padding:0 clamp

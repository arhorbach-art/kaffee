document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ck; align-self:end; padding-top:28px; border-bottom:1px solid #DCCFC2;\"><\u002Fspan>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{ shopEmpty }}\"><p style=\"font-size:17px; line-height:26px; padding:48px 0; border-bottom:1px solid #DCCFC2;\">Keine Mischung passt zu diesem Filter. <button type=\"button\" sc-camel-on-click=\"{{ shopReset }}\" style=\"border:0; background:transparent; padding:0; font-size:17px; color:#1A1512; text-decoration:underline; text-underline-offset:5px; cursor:pointer;\">Alle Kaffees zeigen<\u002Fbutton><\u002Fp><\u002Fsc-if>\n<p style=\"font-size:14px; line-height:20px; color:#4A423B; margin-top:40px;\">Preise inkl. MwSt., zzgl. Versand. Im Abo 10 % unter dem Einzelkauf.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"geschmacksrad\" data-screen-label=\"Home · Geschmacksrad\" style=\"background:#F7F7F7; padding:clamp(72px,8.4vw,120px) 0;\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px);\">\n<div style=\"max-width:720px;\">\n<p style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; color:#4A423B;\">Geschmacksrad<\u002Fp>\n<h2 data-hl=\"1\" style=\"font-size:clamp(32px,3.9vw,56px); line-height:1.07; font-weight:700; letter-spacing:-.015em; text-transform:lowercase; margin-top:16px;\">Nach Geschmack wählen.<\u002Fh2>\n<p style=\"font-size:clamp(17px,1.25vw,18px); line-height:1.6; margin-top:24px; max-width:640px;\">Tippen Sie auf ein Aroma oder eine Aromafamilie. Das Rad zeigt, in welchen unserer Mischungen es steckt.<\u002Fp>\n<\u002Fdiv>\n<div style=\"margin-top:clamp(40px,5vw,64px);\">\n<dc-import name=\"Aroma Wheel\" mode=\"finder\" coffees=\"{{ wheelCoffees }}\" on-open=\"{{ openProduct }}\" on-quick=\"{{ quickOpen }}\" action-label=\"Entdecken\" surface=\"#FFFFFF\" hint-size=\"100%,600px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"fuer-betriebe\" data-screen-label=\"Home · Für Betriebe\" data-dark=\"1\" style=\"background:#1A1512; color:#FFFFFF; padding:clamp(72px,8.4vw,120px) 0;\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px); display:flex; flex-wrap:wrap; flex-direction:row-reverse; align-items:center; gap:clamp(40px,6vw,96px);\">\n<div style=\"flex:5 1 340px; max-width:540px;\">\n<p style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; color:#F1F1F1;\">Für Gastronomie, Hotel &amp; Büro<\u002Fp>\n<h2 data-hl=\"1\" style=\"font-size:clamp(32px,3.9vw,56px); line-height:1.07; font-weight:700; letter-spacing:-.015em; text-transform:lowercase; margin-top:16px;\">Kaffee für Ihre Gäste.<\u002Fh2>\n<p style=\"font-size:clamp(17px,1.25vw,18px); line-height:1.6; margin-top:24px;\">Kaffee, Maschinen, eigene Techniker und Schulung aus einer Hand. In Berlin bis 10 Uhr bestellt, am selben Tag geliefert.<\u002Fp>\n<div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr)); gap:20px; margin-top:40px;\">\n<div style=\"border-top:1px solid #F1F1F1; padding-top:16px;\"><p style=\"font-size:28px; line-height:1.1; font-weight:700; color:#E3002B;\">20 t<\u002Fp><p style=\"font-size:15px; line-height:22px; margin-top:8px;\">pro Monat geröstet<\u002Fp><\u002Fdiv>\n<div style=\"border-top:1px solid #F1F1F1; padding-top:16px;\"><p style=\"font-size:28px; line-height:1.1; font-weight:700; color:#E3002B;\">10 Uhr<\u002Fp><p style=\"font-size:15px; line-height:22px; margin-top:8px;\">bestellt, am selben Tag geliefert<\u002Fp><\u002Fdiv>\n<div style=\"border-top:1px solid #F1F1F1; padding-top:16px;\"><p style=\"font-size:28px; line-height:1.1; font-weight:700; color:#E3002B;\">Service<\u002Fp><p style=\"font-size:15px; line-height:22px; margin-top:8px;\">eigene Techniker für Installation und Wartung<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex; flex-wrap:wrap; gap:16px; width:fit-content; max-width:100%; margin-top:40px;\">\n<a href=\"#kontakt\" sc-camel-on-click=\"{{ book.verkostung }}\" style=\"display:inline-flex; align-items:center; justify-content:center; min-height:54px; padding:0 clamp(24px,2.5vw,36px); border-radius:100px; background:#E3002B; color:#FFFFFF; font-size:clamp(14px,1.05vw,15px); font-weight:700; letter-spacing:.06em; text-transform:uppercase; text-align:center; flex:1 1 auto;\" style-hover=\"background:#FC0030; color:#FFFFFF;\">Verkostung buchen<\u002Fa>\n<a href=\"#b2b\" sc-camel-on-click=\"{{ nav.b2b }}\" style=\"display:inline-flex; align-items:center; justify-content:center; min-height:54px; padding:0 clamp(24px,2.5vw,36px); border-radius:100px; border:1.5px solid #FFFFFF; color:#FFFFFF; font-size:clamp(14px,1.05vw,15px); font-weight:700; letter-spacing:.06em; text-transform:uppercase; text-align:center; flex:1 1 auto;\" style-hover=\"background:#FFFFFF; color:#1A1512;\">Für Geschäftskunden<\u002Fa>\n<\u002Fdiv>\n<a href=\"#login\" sc-camel-on-click=\"{{ nav.login }}\" style=\"display:inline-flex; margin-top:24px; color:#FFFFFF; font-size:16px; font-weight:500; text-decoration:underline; text-underline-offset:5px; text-decoration-thickness:1.5px;\" style-hover=\"color:#F1F1F1;\">Schon Kunde? Zum Kunden-Login →<\u002Fa>\n<\u002Fdiv>\n<div style=\"flex:7 1 460px; min-width:0;\">\n<img src=\"https://arhorbach-art.github.io/kaffee/assets/gastro-6.jpg\" alt=\"Siebträger mit frisch gemahlenem Kaffee vor einer roten Schürze\" style=\"width:100%; aspect-ratio:1/1; object-fit:cover; display:block;\">\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Home · Abo\" data-dark=\"1\" style=\"background:#E3002B; color:#FFFFFF; padding:clamp(72px,8.4vw,120px) 0;\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px); display:flex; flex-wrap:wrap; align-items:center; gap:clamp(40px,6vw,96px);\">\n<div style=\"flex:5 1 340px; max-width:520px;\">\n<p style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase;\">Andraschko Abo<\u002Fp>\n<h2 data-hl=\"1\" style=\"font-size:clamp(32px,3.9vw,56px); line-height:1.07; font-weight:700; letter-spacing:-.015em; text-transform:lowercase; margin-top:16px;\">Nie wieder ohne Kaffee.<\u002Fh2>\n<p style=\"font-size:clamp(17px,1.25vw,18px); line-height:1.6; margin-top:24px;\">Euer Lieblingskaffee im eigenen Rhythmus, 10 % günstiger als im Einzelkauf. Pausieren und ändern im Kundenkonto.<\u002Fp>\n<div style=\"display:flex; flex-wrap:wrap; gap:16px; width:fit-content; max-width:100%; margin-top:40px;\">\n<a href=\"#abo\" sc-camel-on-click=\"{{ nav.aboConfig }}\" style=\"display:inline-flex; align-items:center; justify-content:center; min-height:54px; padding:0 clamp(24px,2.5vw,36px); border-radius:100px; background:#FFFFFF; color:#E3002B; font-size:clamp(14px,1.05vw,15px); font-weight:700; letter-spacing:.06em; text-transform:uppercase; text-align:center; flex:1 1 auto;\" style-hover=\"background:#F1F1F1; color:#C00018;\">Abo zusammenstellen<\u002Fa>\n<a href=\"#so-gehts\" sc-camel-on-click=\"{{ nav.aboSteps }}\" style=\"display:inline-flex; align-items:center; justify-content:center; min-height:54px; padding:0 clamp(24px,2.5vw,36px); border-radius:100px; border:1.5px solid #FFFFFF; color:#FFFFFF; font-size:clamp(14px,1.05vw,15px); font-weight:700; letter-spacing:.06em; text-transform:uppercase; text-align:center; flex:1 1 auto;\" style-hover=\"background:#FFFFFF; color:#E3002B;\">So funktioniert's<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:7 1 460px; min-width:0;\">\n<img src=\"https://arhorbach-art.github.io/kaffee/assets/abo-2.jpg\" alt=\"Espressomaschine und Mühle in einer Küche zu Hause\" style=\"width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:#F1F1F1;\">\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"geschichte\" data-screen-label=\"Home · Geschichte\" data-dark=\"1\" style=\"position:relative; min-height:clamp(560px,62vw,820px); background:#1A1512; color:#FFFFFF; display:flex; align-items:center; overflow:hidden;\">\n<img src=\"https://arhorbach-art.github.io/kaffee/assets/founders.jpg\" alt=\"Willy und Elisabeth Andraschko\" style=\"position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:55% 28%;\">\n<div aria-hidden=\"true\" style=\"position:absolute; inset:0; background:linear-gradient(90deg, rgba(26,21,18,.82) 0%, rgba(26,21,18,.55) 45%, rgba(26,21,18,.12) 80%);\"><\u002Fdiv>\n<div style=\"position:relative; width:100%; max-width:1280px; margin:0 auto; padding:96px clamp(20px,3.5vw,40px);\">\n<p style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase;\">Die Andraschkos<\u002Fp><div style=\"max-width:520px;\">\n\n<h2 data-hl=\"1\" style=\"font-size:clamp(32px,3.9vw,56px); line-height:1.07; font-weight:700; letter-spacing:-.015em; text-transform:lowercase; margin-top:16px;\">Seit 1979 in Berlin.<\u002Fh2>\n<p style=\"font-size: clamp(17px,1.25vw,18px); line-height: 1.6; margin-top: 24px; max-width: 520px;\">Willy Andraschko, gebürtiger Wiener, kam Ende der 1970er-Jahre ins Café Einstein. Seit 2006 rösten wir in unserer eigenen Rösterei in Tempelhof.<\u002Fp>\n<div style=\"display:flex; flex-wrap:wrap; gap:16px; width:fit-content; max-width:100%; margin-top:40px;\">\n<a href=\"#ueber-uns\" sc-camel-on-click=\"{{ nav.ueber }}\" style=\"display:inline-flex; align-items:center; justify-content:center; min-height:54px; padding:0 clamp(24px,2.5vw,36px); border-radius:100px; background:#FFFFFF; color:#E3002B; font-size:clamp(14px,1.05vw,15px); font-weight:700; letter-spacing:.06em; text-transform:uppercase; text-align:center; flex:1 1 auto;\" style-hover=\"background:#F1F1F1; color:#C00018;\">Unsere Geschichte<\u002Fa>\n<a href=\"#roesterei\" sc-camel-on-click=\"{{ nav.roesterei }}\" style=\"display:inline-flex; align-items:center; justify-content:center; min-height:54px; padding:0 clamp(24px,2.5vw,36px); border-radius:100px; border:1.5px solid #FFFFFF; color:#FFFFFF; font-size:clamp(14px,1.05vw,15px); font-weight:700; letter-spacing:.06em; text-transform:uppercase; text-align:center; flex:1 1 auto;\" style-hover=\"background:#FFFFFF; color:#1A1512;\">Die Rösterei<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Home · Rarity Line und Specialty\" style=\"background:#F7F7F7; padding:clamp(72px,8.4vw,120px) 0;\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px); display:grid; gap:clamp(56px,7vw,96px);\">\n<div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:clamp(32px,5vw,80px);\">\n<div style=\"flex:1 1 360px; background:#F1F1F1; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; overflow:hidden;\">\n<img src=\"https://arhorbach-art.github.io/kaffee/assets/home-kenya.png\" alt=\"Packung aus der Rarity Line\" style=\"width:52%; height:auto; display:block;\">\n<\u002Fdiv>\n<div style=\"flex:1 1 360px; max-width:520px;\">\n<p style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; color:#4A423B;\">Rarity Line<\u002Fp>\n<h3 style=\"font-size:clamp(22px,2vw,28px); line-height:1.22; font-weight:500; margin-top:16px;\">Seltene Kaffees, sorgfältig ausgewählt<\u002Fh3>\n<p style=\"font-size:clamp(17px,1.25vw,18px); line-height:1.6; margin-top:16px;\">Saisonale Lots von Produzenten aus aller Welt, ausgewählt nach Tassenqualität und seltenen Varietäten.<\u002Fp>\n<div style=\"display:flex; flex-wrap:wrap; gap:16px; width:fit-content; max-width:100%; margin-top:32px;\">\n<a href=\"https://andraschkokaffee.com/collections/rarity-line\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex; align-items:center; justify-content:center; min-height:54px; padding:0 clamp(24px,2.5vw,36px); borde :24px;\">Lieferung<\u002Fh3>\n<p style=\"font-size:16px; line-height:25px; color:#4A423B; margin-top:10px;\">In Berlin bis 10 Uhr bestellt, am selben Tag geliefert.<\u002Fp>\n<\u002Fdiv>\n<div id=\"private-label\" style=\"background:#F1F1F1; padding:clamp(28px,3vw,40px);\">\n<svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1A1512\" stroke-width=\"1.3\" aria-hidden=\"true\"><path d=\"M3.5 3.5h8.2l8.8 8.8-8.2 8.2-8.8-8.8z\"><\u002Fpath><circle cx=\"8\" cy=\"8\" r=\"1.5\"><\u002Fcircle><\u002Fsvg>\n<h3 style=\"font-size:24px; line-height:1.25; font-weight:500; margin-top:24px;\">Private Label &amp; Private Blend<\u002Fh3>\n<p style=\"font-size:16px; line-height:25px; color:#4A423B; margin-top:10px;\">Unser Kaffee in Ihrem Look (250 g, 500 g, 1 kg) oder Ihre eigene Mischung nach einem Cupping.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n\n<section id=\"b2b-abo\" data-screen-label=\"Geschäftskunden · Abo\" style=\"border-top:1px solid #E3002B; background:#F1F1F1; padding:clamp(48px,5vw,72px) 0;\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px);\">\n<div style=\"display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:20px 64px; margin-bottom:clamp(32px,4vw,48px);\">\n<div><p style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; color:#4A423B;\">Kaffee für Betriebe<\u002Fp>\n<h2 data-hl=\"1\" style=\"font-size:clamp(32px,3.9vw,56px); line-height:1.07; font-weight:700; letter-spacing:-.015em; text-transform:lowercase; margin-top:16px;\">Vier Wege für Ihren Betrieb.<\u002Fh2><\u002Fdiv>\n<p style=\"font-size:clamp(17px,1.25vw,18px); line-height:1.6; max-width:480px;\">Büro, Gastronomie, Hotel und Catering oder Private Label. Menge nach Bedarf, Rabatt nach Monatsmenge, Lieferung im festen Rhythmus.<\u002Fp>\n<\u002Fdiv>\n<dc-import name=\"Abo Plans\" variant=\"b2b1\" on-quote=\"{{ toQuote }}\" wheel-coffees=\"{{ wheelCoffees }}\" audience=\"b2b\" switchable=\"{{ false }}\" on-book=\"{{ book.angebot }}\" on-tasting=\"{{ book.verkostung }}\" on-wheel=\"{{ b2bWheel }}\" on-blend=\"{{ b2bBlend }}\" hint-size=\"100%,1300px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Geschäftskunden · So starten wir\" style=\"border-top:1px solid #E3002B; padding:clamp(48px,5vw,72px) 0;\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px);\">\n<h2 data-hl=\"1\" style=\"font-size:clamp(32px,3.9vw,56px); line-height:1.07; font-weight:700; letter-spacing:-.015em; text-transform:lowercase;\">So starten wir.<\u002Fh2>\n<ol style=\"list-style:none; margin:56px 0 0; padding:0; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr)); gap:40px 32px;\">\n<li style=\"position:relative; border-top:1.5px solid #1A1512; padding-top:28px;\">\n<span aria-hidden=\"true\" style=\"position:absolute; top:-6.5px; left:0; width:12px; height:12px; border-radius:100px; background:#E3002B;\"><\u002Fspan>\n<p style=\"font-size:28px; line-height:1; font-weight:700; color:#E3002B;\">01<\u002Fp>\n<h3 style=\"font-size:24px; line-height:1.25; font-weight:500; margin-top:14px;\">Verkostung<\u002Fh3>\n<p style=\"font-size:16px; line-height:25px; color:#4A423B; margin-top:10px;\">In der Rösterei in Tempelhof oder bei Ihnen: Wir verkosten die Kaffees, die zu Ihrem Angebot passen.<\u002Fp>\n<\u002Fli>\n<li style=\"position:relative; border-top:1.5px solid #1A1512; padding-top:28px;\">\n<span aria-hidden=\"true\" style=\"position:absolute; top:-6.5px; left:0; width:12px; height:12px; border-radius:100px; background:#E3002B;\"><\u002Fspan>\n<p style=\"font-size:28px; line-height:1; font-weight:700; color:#E3002B;\">02<\u002Fp>\n<h3 style=\"font-size:24px; line-height:1.25; font-weight:500; margin-top:14px;\">Angebot<\u002Fh3>\n<p style=\"font-size:16px; line-height:25px; color:#4A423B; margin-top:10px;\">Kaffee, Maschine, Service und Schulung in einem Angebot, mit festem Ansprechpartner.<\u002Fp>\n<\u002Fli>\n<li style=\"position:relative; border-top:1.5px solid #1A1512; padding-top:28px;\">\n<span aria-hidden=\"true\" style=\"position:absolute; top:-6.5px; left:0; width:12px; height:12px; border-radius:100px; background:#E3002B;\"><\u002Fspan>\n<p style=\"font-size:28px; line-height:1; font-weight:700; color:#E3002B;\">03<\u002Fp>\n<h3 style=\"font-size:24px; line-height:1.25; font-weight:500; margin-top:14px;\">Start<\u002Fh3>\n<p style=\"font-size:16px; line-height:25px; color:#4A423B; margin-top:10px;\">Installation, Einstellung und Schulung durch unsere Techniker und Baristas.<\u002Fp>\n<\u002Fli>\n<li style=\"position:relative; border-top:1.5px solid #1A1512; padding-top:28px;\">\n<span aria-hidden=\"true\" style=\"position:absolute; top:-6.5px; left:0; width:12px; height:12px; border-radius:100px; background:#E3002B;\"><\u002Fspan>\n<p style=\"font-size:28px; line-height:1; font-weight:700; color:#E3002B;\">04<\u002Fp>\n<h3 style=\"font-size:24px; line-height:1.25; font-weight:500; margin-top:14px;\">Nachbestellen<\u002Fh3>\n<p style=\"font-size:16px; line-height:25px; color:#4A423B; margin-top:10px;\">Online im Kunden-Login mit Ihren Preisen oder per Telefon. In Berlin bis 10 Uhr bestellt, am selben Tag geliefert.<\u002Fp>\n<\u002Fli>\n<\u002Fol>\n<div style=\"display:flex; flex-wrap:wrap; gap:16px; width:fit-content; max-width:100%; margin-top:56px;\">\n<a href=\"#kontakt\" sc-camel-on-click=\"{{ book.verkostung }}\" style=\"display:inline-flex; align-items:center; justify-content:center; min-height:54px; padding:0 clamp(24px,2.5vw,36px); border-radius:100px; background:#E3002B; color:#FFFFFF; font-size:clamp(14px,1.05vw,15px); font-weight:700; letter-spacing:.06em; text-transform:uppercase; text-align:center; flex:1 1 auto;\" style-hover=\"background:#FC0030; color:#FFFFFF;\">Verkostung buchen<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsectio %; aspect-ratio:4/3; object-fit:cover; display:block;\">\n<p style=\"font-size:15px; line-height:22px; color:#4A423B; margin-top:20px;\">Kunde seit 10 Jahren<\u002Fp>\n<h3 style=\"font-size:24px; line-height:1.25; font-weight:500; margin-top:2px;\">Zeit für Brot<\u002Fh3>\n<blockquote style=\"font-size:18px; line-height:28px; margin-top:16px;\">„Für unseren Kaffee verwenden wir seit 10 Jahren eine hauseigene Bio-Röstung mit Noten von Mandeln, Krokant und reifen Orangen von Andraschko.“<\u002Fblockquote>\n<figcaption style=\"font-size:14px; line-height:20px; color:#4A423B; margin-top:12px;\"><span data-todo=\"1\">[Name, Rolle]<\u002Fspan><\u002Ffigcaption>\n<\u002Ffigure>\n<figure style=\"scroll-snap-align:start; display:flex; flex-direction:column;\">\n<img src=\"https://arhorbach-art.github.io/kaffee/assets/ref-claerchens.jpg\" alt=\"Gastgeber von Clärchens Ballhaus\" style=\"width:100%; aspect-ratio:4/3; object-fit:cover; display:block;\">\n<p style=\"font-size:15px; line-height:22px; color:#4A423B; margin-top:20px;\">Kunde seit der Eröffnung<\u002Fp>\n<h3 style=\"font-size:24px; line-height:1.25; font-weight:500; margin-top:2px;\">Clärchens Ballhaus<\u002Fh3>\n<blockquote style=\"font-size:18px; line-height:28px; margin-top:16px;\">„Andraschko fühlt sich seit Jahren an wie Familie, wie Ankommen und Zuhause sein. Design, Geschichte, Geschmack – alles lädt dazu ein, gern Teil davon zu sein.“<\u002Fblockquote>\n<figcaption style=\"font-size:14px; line-height:20px; color:#4A423B; margin-top:12px;\"><span data-todo=\"1\">[Name, Rolle]<\u002Fspan><\u002Ffigcaption>\n<\u002Ffigure>\n<\u002Fdiv>\n<p style=\"font-size:14px; line-height:20px; color:#4A423B; margin-top:24px;\"><span data-todo=\"1\">[Schriftliche Freigabe für Namen, Zitate und Fotos einholen]<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n\n<section data-screen-label=\"Geschäftskunden · Kunden-Login\" data-dark=\"1\" style=\"background:#1A1512; color:#FFFFFF; padding:clamp(64px,7vw,96px) 0;\">\n<div ercase; text-align:center; flex:1 1 auto;\" style-hover=\"background:#FC0030; color:#FFFFFF;\">Zum Kunden-Login<\u002Fa>\n<a href=\"#kontakt\" sc-camel-on-click=\"{{ book.angebot }}\" style=\"display:inline-flex; align-items:center; justify-content:center; min-height:54px; padding:0 clamp(24px,2.5vw,36px); border-radius:100px; border:1.5px solid #FFFFFF; color:#FFFFFF; font-size:clamp(14px,1.05vw,15px); font-weight:700; letter-spacing:.06em; text-transform:uppercase; text-align:center; flex:1 1 auto;\" style-hover=\"background:#FFFFFF; color:#1A1512;\">Zugang anfordern<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Geschäftskunden · Probierbox\" style=\"border-top:1px solid #E3002B; background:#F1F1F1; padding:clamp(56px,6vw,80px) 0;\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px); display:flex; flex-wrap:wrap; gap:32px 64px; align-items:center;\">\n<img src=\"https://arhorbach-art.github.io/kaffee/assets/b2b-overview.jpg\" alt=\"Kaffeepackungen von Andraschko\" style=\"flex:0 1 340px; width:340px; max-width:100%; height:auto; display:block;\">\n<div style=\"flex:1 1 320px;\">\n<h3 style=\"font-size:clamp(22px,2vw,28px); line-height:1.22; font-weight:500;\">Erst probieren?<\u002Fh3>\n<p style=\"font-size:clamp(17px,1.25vw,18px); line-height:1.6; margin-top:12px;\">Für Betriebe außerhalb Berlins: die Probierbox mit <span data-todo=\"1\">[Inhalt festlegen]<\u002Fspan>.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex; flex-wrap:wrap; gap:16px; width:fit-content; max-width:100%;\">\n<a href=\"#kontakt\" sc-camel-on-click=\"{{ book.verkostung }}\" style=\"display:inline-flex; align-items:center; justify-content:center; min-height:54px; padding:0 clamp(24px,2.5vw,36px); border-radius:100px; background:#1A1512; color:#FFFFFF; font-size:clamp(14px,1.05vw,15px); font-weight:700; letter-spacing:.06em; text-transform:uppercase; text-align:center; flex:1 1 auto;\" style-hover=\"background:#3B3532; color:#F :scale(1.03);\"><\u002Fdiv>\n<h3 style=\"font-size:clamp(32px,3.4vw,52px); line-height:1.08; font-weight:500; letter-spacing:-.015em; margin-top:28px;\">Büros<\u002Fh3>\n<p style=\"font-size:17px; line-height:27px; color:#4A423B; margin-top:12px; max-width:520px;\">Kaffee für Team und Gäste, mit Mengenrabatt und Maschine.<\u002Fp>\n<p style=\"font-size:15px; line-height:22px; margin-top:12px;\">ab 6 kg −10 %, ab 12 kg −15 % <span data-todo=\"1\">[Zeiteinheit festlegen]<\u002Fspan> · Maschinen kaufen oder leasen · Service durch eigene Techniker<\u002Fp>\n<div style=\"display:flex; flex-wrap:wrap; gap:4px 24px; margin-top:18px;\"><a href=\"#angebotsfinder\" sc-camel-on-click=\"{{ finder.office }}\" style=\"display:inline-flex; align-self:flex-start; font-size:16px; font-weight:500; color:#1A1512; text-decoration:underline; text-underline-offset:5px; text-decoration-thickness:1px;\" style-hover=\"color:#C00018;\">Angebot für Ihr Büro →<\u002Fa><a href=\"https://andraschkokaffee.com/pages/buero\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex; align-self:flex-start; font-size:16px; font-weight:500; color:#1A1512; text-decoration:underline; text-underline-offset:5px; text-decoration-thickness:1px;\" style-hover=\"color:#C00018;\">Zum Büro-Angebot<\u002Fa><\u002Fdiv>\n<\u002Farticle>\n<article style=\"flex:none; width:clamp(280px,36vw,600px); scroll-snap-align:start; display:flex; flex-direction:column;\">\n<div style=\"aspect-ratio:8/9; overflow:hidden; background:#E9DFD4;\"><img src=\"https://arhorbach-art.github.io/kaffee/assets/gastro-3.jpg\" alt=\"Kaffeepackungen mit eigenem Etikett\" style=\"width:100%; height:100%; object-fit:cover; display:block; transition:transform .6s cubic-bezier(.2,.7,.2,1);\" style-hover=\"transform:scale(1.03);\"><\u002Fdiv>\n<h3 style=\"font-size:clamp(32px,3.4vw,52px); line-height:1.08; font-weight:500; letter-spacing:-.015em; margin-top:28px;\">Private Label<\u002Fh3>\n<p style=\"font-size:17px; line-height:27px; color:#4 ter-spacing:-.015em; text-transform:lowercase; margin-top:16px;\">Vier Wege für Ihren Betrieb.<\u002Fh2><\u002Fdiv>\n<p style=\"font-size:clamp(17px,1.25vw,18px); line-height:1.6; max-width:480px;\">Büro, Gastronomie, Hotel oder Specialty. Menge nach Bedarf, Rabatt nach Monatsmenge, Lieferung im festen Rhythmus.<\u002Fp>\n<\u002Fdiv>\n<dc-import name=\"Abo Plans\" wheel-coffees=\"{{ wheelCoffees }}\" audience=\"b2b\" switchable=\"{{ false }}\" on-book=\"{{ book.angebot }}\" on-tasting=\"{{ book.verkostung }}\" on-wheel=\"{{ b2bWheel }}\" on-blend=\"{{ b2bBlend }}\" hint-size=\"100%,1300px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n\n<section id=\"leistungen\" data-screen-label=\"Geschäftskunden 2 · Leistungen\" style=\"border-top:1px solid #E3002B; background:#F1F1F1; padding:clamp(48px,5vw,72px) 0;\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px);\">\n<p style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; color:#4A423B;\">Leistungen<\u002Fp>\n<h2 data-hl=\"1\" style=\"font-size:clamp(32px,3.9vw,56px); line-height:1.07; font-weight:700; letter-spacing:-.015em; text-transform:lowercase; margin-top:16px;\">Alles aus einer Hand.<\u002Fh2>\n<div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:1px; background:#D9CBBE; border:1px solid #D9CBBE; margin-top:56px;\">\n<div style=\"background:#F1F1F1; padding:clamp(28px,3vw,40px);\">\n<svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1A1512\" stroke-width=\"1.3\" aria-hidden=\"true\"><ellipse cx=\"12\" cy=\"12\" rx=\"6.2\" ry=\"8.8\" transform=\"rotate(30 12 12)\"><\u002Fellipse><path d=\"M8.6 18.6c3.1-2.2 1.2-5.6 3.3-8 1.5-1.8 3.7-2.4 3.5-5.6\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"font-size:24px; line-height:1.25; font-weight:500; margin-top:24px;\">Kaffee<\u002Fh3>\n<p style=\"font-size:16px; line-height:25px; color:#4A423B; margin-top:10px;\">Blends, Single Origins und Bio, frisch geröstet in Tempelhof.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#F1F1F1; padding:clamp(28px,3vw,40px);\">\n<svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1A1512\" stroke-width=\"1.3\" aria-hidden=\"true\"><path d=\"M4 4.5h16V9H4zM5.5 9v8.5h13V9M3 20h18M9 17.5V20M15 17.5V20M10 12.5h4\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"font-size:24px; line-height:1.25; font-weight:500; margin-top:24px;\">Maschinen<\u002Fh3>\n<p style=\"font-size:16px; line-height:25px; color:#4A423B; margin-top:10px;\">La Marzocco und Mazzer, kaufen oder leasen.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#F1F1F1; padding:clamp(28px,3vw,40px);\">\n<svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1A1512\" stroke-width=\"1.3\" aria-hidden=\"true\"><path d=\"M15 4a4.5 4.5 0 0 0-4.3 5.9L3.5 17.1a2 2 0 0 0 2.8 2.8l7.2-7.2A4.5 4.5 0 0 0 19.6 8l-2.8 2.8-2.6-.5-.5-2.6L16.5 4.9A4.5 4.5 0 0 0 15 4z\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"font-size:24px; line-height:1.25; font-weight:500; margin-top:24px;\">Service<\u002Fh3>\n<p style=\"font-size:16px; line-height:25px; color:#4A423B; margin-top:10px;\">Eigene Techniker für Installation, Wartung und Reparatur.<\u002Fp>\n<\u002Fdiv>\n<div id=\"schulung\" style=\"background:#F1F1F1; padding:clamp(28px,3vw,40px);\">\n<svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1A1512\" stroke-width=\"1.3\" aria-hidden=\"true\"><path d=\"M2.5 9L12 4.5 21.5 9 12 13.5 2.5 9z\"><\u002Fpath><path d=\"M6.5 11v5c1.5 1.5 3.4 2.2 5.5 2.2s4-.7 5.5-2.2v-5M21.5 9v5.5\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"font-size:24px; line-height:1.25; font-weight:500; margin-top:24px;\">Schulung<\u002Fh3>\n<p style=\"font-size:16px; line-height:25px; color:#4A423B; margin-top:10px;\">Barista-Schulung in Ihrem Betrieb oder in der Rösterei, mit Führung durch die Produktion.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#F1F1F1; padding:clamp(28px,3vw,40px);\">\n<svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1A1512\" stroke-width=\"1.3\" aria-hidden=\"true\"><path d=\"M2.5 6h11.5v10.5H2.5zM14 9.5h4.2l3.3 3.6v3.4H14\"><\u002Fpath><circle cx=\"6.5\" cy=\"17.5\" r=\"1.9\"><\u002Fcircle><circle cx=\"17.5\" cy=\"17.5\" r=\"1.9\"><\u002Fcircle><\u002Fsvg>\n<h3 style=\"font-size:24px; line-height:1.25; font-weight:500; margin-top:24px;\">Lieferung<\u002Fh3>\n<p style=\"font-size:16px; line-height:25px; color:#4A423B; margin-top:10px;\">In Berlin bis 10 Uhr bestellt, am selben Tag geliefert.<\u002Fp>\n<\u002Fdiv>\n<div id=\"private-label\" style=\"background:#F1F1F1; padding:clamp(28px,3vw,40px);\">\n<svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1A1512\" stroke-width=\"1.3\" aria-hidden=\"true\"><path d=\"M3.5 3.5h8.2l8.8 8.8-8.2 8.2-8.8-8.8z\"><\u002Fpath><circle cx=\"8\" cy=\"8\" r=\"1.5\"><\u002Fcircle><\u002Fsvg>\n<h3 style=\"font-size:24px; line-height:1.25; font-weight:500; margin-top:24px;\">Private Label &amp; Private Blend<\u002Fh3>\n<p style=\"font-size:16px; line-height:25px; color:#4A423B; margin-top:10px;\">Unser Kaffee in Ihrem Look (250 g, 500 g, 1 kg) oder Ihre eigene Mischung nach einem Cupping.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n\n<section data-screen-label=\"Geschäftskunden 2 · So starten wir\" style=\"border-top:1px solid #E3002B; padding:clamp(48px,5vw,72px) 0;\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px);\">\n<h2 data-hl=\"1\" style=\"font-size:clamp(32px,3.9vw,56px); line-height:1.07; font-weight:700; letter-spacing:-.015em; text-transform:lowercase;\">So starten wir.<\u002Fh2>\n<ol style=\"list-style:none; margin:56px 0 0; padding:0; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr)); gap:40px 32px;\">\n<li style=\"position:relative; border-top:1.5px ; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; color:#4A423B;\">Sortiment<\u002Fp>\n<h2 data-hl=\"1\" style=\"font-size:clamp(32px,3.9vw,56px); line-height:1.07; font-weight:700; letter-spacing:-.015em; text-transform:lowercase; margin-top:16px;\">Das Andraschko-Sortiment.<\u002Fh2>\n<\u002Fdiv>\n<p style=\"flex:1 1 360px; max-width:520px; font-size:clamp(17px,1.25vw,18px); line-height:1.6;\">Alle 34 Artikel der Rösterei: 26 Kaffees sowie Kapseln, Probiersets und Geschenkboxen, mit den Geschmacksnoten von der Packung. Beginnen Sie beim Aroma, das Sie in der Tasse wollen, oder bei einem Kaffee: wo er wächst und zu wem er passt.<\u002Fp>\n<\u002Fdiv>\n<div style=\"margin-top:clamp(32px,4vw,48px);\">\n<dc-import name=\"Range Explorer\" start-tab=\"{{ reTab }}\" tab-nonce=\"{{ reN }}\" on-open-product=\"{{ openProduct }}\" on-quick=\"{{ quickOpen }}\" on-book=\"{{ book.verkostung }}\" hint-size=\"100%,760px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isMaschPage }}\">\n<main id=\"main\" style=\"padding-top:88px; background:#1A1512;\">\n<section id=\"maschinen\" data-screen-label=\"Maschinen &amp; Service\" data-dark=\"1\" style=\"background:#1A1512; color:#FFFFFF; padding:clamp(72px,8.4vw,120px) 0;\">\n<div style=\"max-width:1280px; margin:0 auto; padding:0 clamp(20px,3.5vw,40px); display:flex; flex-wrap:wrap; align-items:center; gap:clamp(40px,6vw,96px);\">\n<div style=\"flex:5 1 340px; max-width:540px;\">\n<p style=\"font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.12em; text-transform:uppercase; color:#F1F1F1;\">Maschinen &amp; Service<\u002Fp>\n<h2 data-hl=\"1\" style=\"font-size:clamp(32px,3.9vw,56px); line-height:1.07; font-weight:700; letter-spacing:-.015em; text-transform:lowercase; margin-top:16px;\">Handgebaut in Florenz. Eingestellt in Berlin.<\u002Fh2>\n<p style=\"font-size:clamp(17px,1.25vw,18px); line-height:1.6; margin-top:24px;\">Wir liefern La Marzocco Espressomaschinen, stellen sie mit Ihrem Kaffee ein, warten sie mit eigenen Technikern und schulen Ihr Team.<\u002Fp>\n<div style=\"display:flex; flex-wrap:wrap; gap:16px; width:fit-content; max-width:100%; margin-top:40px;\">\n<a href=\"#kontakt\" sc-camel-on-click=\"{{ book.maschine }}\" style=\"display:inline-flex; align-items:center; justify-content:center; min-height:54px; padding:0 clamp(24px,2.5vw,36px); border-radius:100px; background:#E3002B; color:#FFFFFF; font-size:clamp(14px,1.05vw,15px); font-weight:700; letter-spacing:.06em; text-transform:uppercase; text-align:center; flex:1 1 auto;\" style-hover=\"background:#FC0030; color:#FFFFFF;\">Maschine anfragen<\u002Fa>\n<a href=\"#kontakt\" sc-camel-on-click=\"{{ book.maschine }}\" style=\"display:inline-flex; align-items:center; justify-content:center; min-height:54px; padding:0 clamp(24px,2.5vw,36px); border-radius:100px; border:1.5px solid #FFFFFF; color:#FFFFFF; font-size:clamp(14px,1.05vw,15px); font-weight:700; letter-spacing:.06em; text-transform:uppercase; text-align:center; flex:1 1 auto;\" style-hover=\"background:#FFFFFF; color:#1A1512;\">Service anfragen<\u002Fa>\n<\u002Fdiv>\n<p data-todo=\"1\" style=\"display:inline-flex; margin-top:32px; padding:10px 16px; border:1.5px dashed #F1F1F1; font-family:'Courier Prime',ui-monospace,monospace; font-size:13px; line-height:18px; letter-spacing:.1em; text-transform:uppercase;\">La Marzocco Partner · nur nach Freigabe<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:7 1 460px; min-width:0;\">\n<img src=\"https://arhorbach-art.github.io/kaffee/assets/gastro-5.jpg\" alt=\"La Marzocco Espressomaschine in einem Partnercafé, dahinter Andraschko-Packungen im Regal\" style=\"width:100%; aspect-ratio:1/1; object-fit:cover; display:block;\">\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"maschinen-modelle\" data-screen-label=\"Maschinen · Modelle\" style=\"background:#F1F1F1; color:#1A1512; padding:clamp(8

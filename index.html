<title>Coffee Atlas</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#241B16;color:#F3ECE5;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.box{width:min(360px,100%);text-align:center}
.mark{width:84px;height:84px;display:block;margin:0 auto}
h1{margin:14px 0 4px;font:400 34px/1.1 Georgia,"Times New Roman",serif}
p{margin:0 0 20px;color:#CFC2B6;font-size:15px}
input[type=password]{width:100%;height:50px;padding:0 16px;border:1px solid rgba(255,255,255,.25);border-radius:12px;background:#30261F;color:#fff;font:inherit;font-size:16px}
input[type=password]:focus{outline:none;border-color:#D8B865;box-shadow:0 0 0 3px rgba(216,184,101,.3)}
button{width:100%;height:50px;margin-top:12px;border:0;border-radius:999px;background:#D8B865;color:#241B16;font:700 16px system-ui,-apple-system,sans-serif;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.rm{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;color:#CFC2B6;font-size:14px}
.rm input{width:18px;height:18px;accent-color:#D8B865}
.err{min-height:22px;margin-top:12px;color:#FF8A80;font-size:14px}
</style>

  function bytes(s){ var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
  function unlock(pw){
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"])
      .then(function(k){ return crypto.subtle.deriveKey({name:"PBKDF2", salt:bytes(SALT), iterations:ITER, hash:"SHA-256"}, k, {name:"AES-GCM", length:256}, false, ["decrypt"]); })
      .then(function(key){ return crypto.subtle.decrypt({name:"AES-GCM", iv:bytes(IV)}, key, bytes(DATA)); })
      .then(function(gz){ return new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text(); });
  }
  var f=document.getElementById("f"), err=document.getElementById("err"), btn=document.getElementById("go");
  function tryOpen(pw, remember){
    if(!window.crypto || !crypto.subtle || typeof DecompressionStream==="undefined"){ err.textContent="This browser is too old. Please update it. · Bitte den Browser aktualisieren."; return; }
    btn.disabled=true; err.textContent="";
    unlock(pw).then(function(html){
      try{ if(remember) localStorage.setItem("atlas-pw", pw); }catch(e){}
      document.open(); document.write(html); document.close();
    }).catch(function(){
      btn.disabled=false; err.textContent="Wrong password. · Falsches Passwort.";
      try{ localStorage.removeItem("atlas-pw"); }catch(e){}
    });
  }
  f.addEventListener("submit", function(e){ e.preventDefault(); tryOpen(document.getElementById("pw").value, document.getElementById("rm").checked); });
  try{ var saved=localStorage.getItem("atlas-pw"); if(saved) tryOpen(saved, true); }catch(e){}
})();
